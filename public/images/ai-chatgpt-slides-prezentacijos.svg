<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChatGPT Slides prezentacijos">
  <defs>
    <linearGradient id="bg-slides" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-slides" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-slides" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-slides)"/>
  <rect width="1200" height="750" fill="url(#grid-slides)"/>
  <rect width="1200" height="750" fill="url(#glow-slides)"/>

  <!-- slide stack - back -->
  <g transform="translate(380 160)">
    <rect x="20" y="20" width="420" height="260" rx="10" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-opacity="0.15" stroke-width="1"/>
  </g>
  <!-- slide stack - middle -->
  <g transform="translate(380 160)">
    <rect x="10" y="10" width="420" height="260" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
  </g>
  <!-- slide - front (main) -->
  <g transform="translate(380 160)">
    <rect x="0" y="0" width="420" height="260" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- slide title -->
    <rect x="30" y="30" width="220" height="18" rx="4" fill="#3b82f6" fill-opacity="0.3"/>

    <!-- bullet points -->
    <circle cx="42" cy="76" r="4" fill="#3b82f6" fill-opacity="0.4"/>
    <rect x="56" y="70" width="260" height="12" rx="3" fill="#94a3b8" fill-opacity="0.2"/>

    <circle cx="42" cy="104" r="4" fill="#3b82f6" fill-opacity="0.4"/>
    <rect x="56" y="98" width="220" height="12" rx="3" fill="#94a3b8" fill-opacity="0.18"/>

    <circle cx="42" cy="132" r="4" fill="#3b82f6" fill-opacity="0.4"/>
    <rect x="56" y="126" width="240" height="12" rx="3" fill="#94a3b8" fill-opacity="0.15"/>

    <!-- chart in slide -->
    <rect x="240" y="160" width="150" height="75" rx="6" fill="#0f172a" fill-opacity="0.5"/>
    <rect x="260" y="210" width="18" height="20" rx="2" fill="#3b82f6" fill-opacity="0.4"/>
    <rect x="286" y="195" width="18" height="35" rx="2" fill="#3b82f6" fill-opacity="0.5"/>
    <rect x="312" y="185" width="18" height="45" rx="2" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="338" y="175" width="18" height="55" rx="2" fill="#10b981" fill-opacity="0.5"/>

    <!-- page number -->
    <text x="390" y="248" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8" fill-opacity="0.3">3 / 12</text>
  </g>

  <!-- sidebar thumbnails -->
  <g transform="translate(230 180)">
    <rect x="0" y="0" width="100" height="62" rx="4" fill="#1e293b" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="8" y="8" width="50" height="6" rx="2" fill="#3b82f6" fill-opacity="0.2"/>
    <rect x="8" y="20" width="80" height="4" rx="1" fill="#94a3b8" fill-opacity="0.15"/>
    <rect x="8" y="28" width="70" height="4" rx="1" fill="#94a3b8" fill-opacity="0.1"/>
  </g>
  <g transform="translate(230 254)">
    <rect x="0" y="0" width="100" height="62" rx="4" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="8" y="8" width="40" height="6" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
    <rect x="8" y="20" width="80" height="4" rx="1" fill="#94a3b8" fill-opacity="0.1"/>
  </g>
  <g transform="translate(230 328)">
    <rect x="0" y="0" width="100" height="62" rx="4" fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="8" y="8" width="55" height="6" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
    <rect x="8" y="20" width="75" height="4" rx="1" fill="#94a3b8" fill-opacity="0.1"/>
  </g>

  <!-- export icons -->
  <g transform="translate(860 300)">
    <rect x="0" y="0" width="90" height="30" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ef4444" fill-opacity="0.6">.PPTX</text>
  </g>
  <g transform="translate(860 342)">
    <rect x="0" y="0" width="90" height="30" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#3b82f6" fill-opacity="0.6">.PDF</text>
  </g>

  <!-- spark -->
  <g transform="translate(180 160)" fill="#3b82f6" fill-opacity="0.5">
    <path d="M14 0c1.4 10.5 4.2 13.3 14.7 14.7-10.5 1.4-13.3 4.2-14.7 14.7-1.4-10.5-4.2-13.3-14.7-14.7C9.8 13.3 12.6 10.5 14 0Z"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1">
    <rect x="150" y="600" width="14" height="14" rx="3" fill="#3b82f6" fill-opacity="0.5"/>
    <text x="178" y="612" font-size="26" letter-spacing="6" fill-opacity="0.9">CHATGPT · SLIDES</text>
  </g>
</svg>
