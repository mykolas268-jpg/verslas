<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Google Gemini Business Hub">
  <defs>
    <linearGradient id="bg-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-gem" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4285f4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-gem" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-gem)"/>
  <rect width="1200" height="750" fill="url(#grid-gem)"/>
  <rect width="1200" height="750" fill="url(#glow-gem)"/>

  <!-- central hub circle -->
  <circle cx="600" cy="340" r="110" fill="none" stroke="#4285f4" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="600" cy="340" r="60" fill="#4285f4" fill-opacity="0.1" stroke="#4285f4" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Gemini star icon in center -->
  <g transform="translate(600 340)">
    <path d="M0,-30 L8,-8 L30,0 L8,8 L0,30 L-8,8 L-30,0 L-8,-8 Z" fill="#4285f4" fill-opacity="0.6"/>
    <path d="M0,-18 L5,-5 L18,0 L5,5 L0,18 L-5,5 L-18,0 L-5,-5 Z" fill="#4285f4" fill-opacity="0.3"/>
  </g>

  <!-- connected app nodes -->
  <!-- top: brand -->
  <line x1="600" y1="230" x2="600" y2="170" stroke="#4285f4" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="600" cy="155" r="28" fill="#1e293b" fill-opacity="0.6" stroke="#ea4335" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="586" y="145" width="28" height="20" rx="4" fill="#ea4335" fill-opacity="0.3"/>

  <!-- left: finance -->
  <line x1="490" y1="340" x2="410" y2="340" stroke="#4285f4" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="390" cy="340" r="28" fill="#1e293b" fill-opacity="0.6" stroke="#34a853" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="376" y="330" width="28" height="20" rx="4" fill="#34a853" fill-opacity="0.3"/>

  <!-- right: customers -->
  <line x1="710" y1="340" x2="790" y2="340" stroke="#4285f4" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="810" cy="340" r="28" fill="#1e293b" fill-opacity="0.6" stroke="#fbbc05" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="796" y="330" width="28" height="20" rx="4" fill="#fbbc05" fill-opacity="0.3"/>

  <!-- bottom-left: Shopify -->
  <line x1="530" y1="420" x2="460" y2="480" stroke="#4285f4" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="445" cy="495" r="22" fill="#1e293b" fill-opacity="0.5" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="435" y="488" width="20" height="14" rx="3" fill="#94a3b8" fill-opacity="0.2"/>

  <!-- bottom-right: Xero -->
  <line x1="670" y1="420" x2="740" y2="480" stroke="#4285f4" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="755" cy="495" r="22" fill="#1e293b" fill-opacity="0.5" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="745" y="488" width="20" height="14" rx="3" fill="#94a3b8" fill-opacity="0.2"/>

  <!-- bottom: Canva -->
  <line x1="600" y1="450" x2="600" y2="510" stroke="#4285f4" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="600" cy="525" r="22" fill="#1e293b" fill-opacity="0.5" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="590" y="518" width="20" height="14" rx="3" fill="#94a3b8" fill-opacity="0.2"/>

  <!-- decorative data bars -->
  <g transform="translate(160 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="12" y="16" width="30" height="6" rx="2" fill="#4285f4" fill-opacity="0.4"/>
    <rect x="12" y="30" width="50" height="6" rx="2" fill="#34a853" fill-opacity="0.3"/>
    <rect x="12" y="44" width="40" height="6" rx="2" fill="#fbbc05" fill-opacity="0.3"/>
    <rect x="12" y="58" width="60" height="6" rx="2" fill="#ea4335" fill-opacity="0.3"/>
  </g>

  <!-- decorative chart -->
  <g transform="translate(920 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <polyline points="15,60 35,45 55,50 75,30 95,25 108,35" fill="none" stroke="#4285f4" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- title area -->
  <text x="600" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" fill-opacity="0.9">Gemini Business Hub</text>
  <text x="600" y="690" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" fill-opacity="0.7">Rinkodara · Finansai · Klientai</text>
</svg>
