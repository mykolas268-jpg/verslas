<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ES AI aktas smulkiam verslui">
  <defs>
    <linearGradient id="bg-eu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-eu" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#003399" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#003399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-eu" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-eu)"/>
  <rect width="1200" height="750" fill="url(#grid-eu)"/>
  <rect width="1200" height="750" fill="url(#glow-eu)"/>

  <!-- EU shield -->
  <g transform="translate(600 280)">
    <path d="M0,-100 L70,-70 L70,20 C70,60 40,90 0,110 C-40,90 -70,60 -70,20 L-70,-70 Z" fill="#003399" fill-opacity="0.1" stroke="#003399" stroke-opacity="0.35" stroke-width="2"/>

    <!-- EU stars circle -->
    <g fill="#FFCC00" fill-opacity="0.5">
      <circle cx="0" cy="-55" r="5"/>
      <circle cx="27" cy="-48" r="5"/>
      <circle cx="48" cy="-27" r="5"/>
      <circle cx="48" cy="5" r="5"/>
      <circle cx="27" cy="26" r="5"/>
      <circle cx="0" cy="33" r="5"/>
      <circle cx="-27" cy="26" r="5"/>
      <circle cx="-48" cy="5" r="5"/>
      <circle cx="-48" cy="-27" r="5"/>
      <circle cx="-27" cy="-48" r="5"/>
    </g>

    <!-- AI chip icon in center -->
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#003399" fill-opacity="0.3"/>
    <!-- chip pins -->
    <line x1="-25" y1="-8" x2="-20" y2="-8" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="-25" y1="0" x2="-20" y2="0" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="-25" y1="8" x2="-20" y2="8" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="20" y1="-8" x2="25" y2="-8" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="20" y1="0" x2="25" y2="0" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="20" y1="8" x2="25" y2="8" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- risk level indicators -->
  <!-- prohibited -->
  <g transform="translate(260 220)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="24" cy="25" r="8" fill="none" stroke="#ef4444" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="18" y1="19" x2="30" y2="31" stroke="#ef4444" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="42" y="16" width="80" height="7" rx="2" fill="#ef4444" fill-opacity="0.2"/>
    <rect x="42" y="28" width="55" height="7" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
  </g>

  <!-- high risk -->
  <g transform="translate(260 370)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <polygon points="24,12 34,38 14,38" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
    <rect x="42" y="16" width="70" height="7" rx="2" fill="#f59e0b" fill-opacity="0.2"/>
    <rect x="42" y="28" width="50" height="7" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
  </g>

  <!-- transparency -->
  <g transform="translate(800 220)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="24" cy="25" r="10" fill="none" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="24" cy="25" r="4" fill="#3b82f6" fill-opacity="0.4"/>
    <rect x="42" y="16" width="80" height="7" rx="2" fill="#3b82f6" fill-opacity="0.25"/>
    <rect x="42" y="28" width="60" height="7" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
  </g>

  <!-- minimal -->
  <g transform="translate(800 370)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
    <polyline points="16,25 22,31 32,19" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="16" width="65" height="7" rx="2" fill="#22c55e" fill-opacity="0.2"/>
    <rect x="42" y="28" width="45" height="7" rx="2" fill="#94a3b8" fill-opacity="0.15"/>
  </g>

  <!-- checklist at bottom -->
  <g transform="translate(440 480)">
    <rect x="0" y="0" width="320" height="100" rx="10" fill="#1e293b" fill-opacity="0.35" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <polyline points="22,25 28,31 38,19" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="22" width="120" height="8" rx="3" fill="#94a3b8" fill-opacity="0.2"/>
    <polyline points="22,50 28,56 38,44" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="47" width="100" height="8" rx="3" fill="#94a3b8" fill-opacity="0.2"/>
    <rect x="18" y="70" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="50" y="72" width="140" height="8" rx="3" fill="#94a3b8" fill-opacity="0.15"/>
  </g>

  <!-- title -->
  <text x="600" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" fill-opacity="0.9">ES AI aktas</text>
  <text x="600" y="680" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" fill-opacity="0.7">Ką privalai žinoti 2026-aisiais</text>
</svg>
