<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dirbtinis intelektas nekilnojamojo turto video turams">
  <defs>
    <linearGradient id="bgn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#114b54"/>
      <stop offset="1" stop-color="#0a2f3a"/>
    </linearGradient>
    <radialGradient id="glown" cx="0.2" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#34d3c0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsn" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#a7eee6" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bgn)"/>
  <rect width="1200" height="750" fill="url(#dotsn)"/>
  <rect width="1200" height="750" fill="url(#glown)"/>

  <!-- video player frame with a house inside -->
  <g>
    <rect x="672" y="150" width="398" height="300" rx="28" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="672" y="150" width="398" height="300" rx="28" fill="none" stroke="#bdeee8" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- house -->
    <path d="M793 292 L871 232 L949 292 Z" fill="#16b8a4" fill-opacity="0.9"/>
    <rect x="812" y="292" width="118" height="96" rx="6" fill="#ffffff" fill-opacity="0.10" stroke="#bdeee8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="824" y="306" width="24" height="24" rx="3" fill="#7ee7d6" fill-opacity="0.5"/>
    <rect x="855" y="332" width="34" height="56" rx="4" fill="#7ee7d6" fill-opacity="0.85"/>

    <!-- play badge -->
    <circle cx="990" cy="408" r="34" fill="#16b8a4" fill-opacity="0.95"/>
    <path d="M979 391 L979 425 L1007 408 Z" fill="#0a2f3a"/>
  </g>

  <!-- photo-to-video lines -->
  <g stroke="#7ee7d6" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <path d="M150 300h360"/>
    <path d="M150 350h300"/>
    <path d="M150 400h340"/>
  </g>

  <!-- spark -->
  <g transform="translate(160 150)" fill="#bdeee8" fill-opacity="0.9">
    <path d="M36 0c3.6 27 10.8 34.2 37.8 37.8C46.8 41.4 39.6 48.6 36 75.6 32.4 48.6 25.2 41.4-1.8 37.8 25.2 34.2 32.4 27 36 0Z"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#bdeee8">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#34d3c0"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · NT VIDEO</text>
  </g>
</svg>
