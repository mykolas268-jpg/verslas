<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SEO straipsnio rašymas su AI">
  <defs>
    <linearGradient id="bg-seo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a3d"/>
      <stop offset="1" stop-color="#060e24"/>
    </linearGradient>
    <radialGradient id="glow-seo" cx="0.55" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-seo" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0V44H0" fill="none" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-seo)"/>
  <rect width="1200" height="750" fill="url(#grid-seo)"/>
  <rect width="1200" height="750" fill="url(#glow-seo)"/>

  <!-- search bar -->
  <g transform="translate(300 200)">
    <rect width="600" height="60" rx="30" fill="#ffffff" fill-opacity="0.07" stroke="#93c5fd" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- magnifying glass icon -->
    <circle cx="50" cy="30" r="12" fill="none" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="58" y1="38" x2="68" y2="48" stroke="#93c5fd" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <!-- text lines -->
    <rect x="85" y="24" width="180" height="12" rx="6" fill="#93c5fd" fill-opacity="0.3"/>
  </g>

  <!-- result items -->
  <g transform="translate(320 300)">
    <rect width="560" height="50" rx="10" fill="#2563eb" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="16" y="14" width="260" height="10" rx="5" fill="#93c5fd" fill-opacity="0.4"/>
    <rect x="16" y="30" width="180" height="8" rx="4" fill="#93c5fd" fill-opacity="0.2"/>
    <!-- #1 badge -->
    <rect x="490" y="12" width="46" height="26" rx="13" fill="#2563eb" fill-opacity="0.4"/>
    <text x="513" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#bfdbfe" font-weight="bold">#1</text>
  </g>
  <g transform="translate(320 365)">
    <rect width="560" height="50" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="16" y="14" width="220" height="10" rx="5" fill="#93c5fd" fill-opacity="0.2"/>
    <rect x="16" y="30" width="160" height="8" rx="4" fill="#93c5fd" fill-opacity="0.12"/>
  </g>
  <g transform="translate(320 430)">
    <rect width="560" height="50" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="16" y="14" width="200" height="10" rx="5" fill="#93c5fd" fill-opacity="0.15"/>
    <rect x="16" y="30" width="140" height="8" rx="4" fill="#93c5fd" fill-opacity="0.1"/>
  </g>

  <!-- upward arrow -->
  <g transform="translate(180 300)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" fill="none">
    <line x1="40" y1="180" x2="40" y2="20"/>
    <polyline points="20,50 40,20 60,50"/>
  </g>

  <!-- spark -->
  <g transform="translate(920 160)" fill="#93c5fd" fill-opacity="0.85">
    <path d="M28 0c3 21 9 27 30 30-21 3-27 9-30 30-3-21-9-27-30-30C19 27 25 21 28 0Z"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#3b82f6"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · SEO</text>
  </g>
</svg>
