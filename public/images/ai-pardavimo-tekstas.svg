<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI pardavimo tekstų kūrimas su ChatGPT">
  <defs>
    <linearGradient id="bg-copy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451a03"/>
      <stop offset="1" stop-color="#1c0a00"/>
    </linearGradient>
    <radialGradient id="glow-copy" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-copy" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f59e0b" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-copy)"/>
  <rect width="1200" height="750" fill="url(#grid-copy)"/>
  <rect width="1200" height="750" fill="url(#glow-copy)"/>

  <!-- document / text block -->
  <g transform="translate(420 160)">
    <rect width="360" height="260" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- text lines -->
    <rect x="36" y="40" width="220" height="12" rx="6" fill="#fbbf24" fill-opacity="0.5"/>
    <rect x="36" y="68" width="288" height="12" rx="6" fill="#fbbf24" fill-opacity="0.35"/>
    <rect x="36" y="96" width="260" height="12" rx="6" fill="#fbbf24" fill-opacity="0.25"/>
    <rect x="36" y="124" width="200" height="12" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
    <!-- CTA button -->
    <rect x="36" y="170" width="140" height="40" rx="10" fill="#d97706" fill-opacity="0.7"/>
    <rect x="56" y="184" width="100" height="12" rx="6" fill="#451a03" fill-opacity="0.6"/>
  </g>

  <!-- cursor -->
  <g transform="translate(810 380)">
    <path d="M0 0L0 42L12 33L20 52L28 48L20 29L34 29Z" fill="#fde68a" fill-opacity="0.7"/>
  </g>

  <!-- spark -->
  <g transform="translate(260 200)" fill="#fde68a" fill-opacity="0.85">
    <path d="M20 0c2 15 6 19 21 21-15 2-19 6-21 21-2-15-6-19-21-21C14 19 18 15 20 0Z"/>
  </g>

  <!-- small spark -->
  <g transform="translate(900 180)" fill="#fbbf24" fill-opacity="0.6">
    <path d="M10 0c1 7.5 3 9.5 10.5 10.5-7.5 1-9.5 3-10.5 10.5-1-7.5-3-9.5-10.5-10.5C7 9.5 9 7.5 10 0Z"/>
  </g>

  <!-- formula badge -->
  <rect x="180" y="480" width="180" height="36" rx="18" fill="#d97706" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
  <text x="270" y="504" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fde68a" letter-spacing="2">AIDA · PAS · BAB</text>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#fde68a">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · COPYWRITING</text>
  </g>
</svg>
