<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI buhalterija ir finansų valdymas">
  <defs>
    <linearGradient id="bg-fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-fin" cx="0.6" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-fin" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-fin)"/>
  <rect width="1200" height="750" fill="url(#grid-fin)"/>
  <rect width="1200" height="750" fill="url(#glow-fin)"/>

  <!-- spreadsheet / ledger grid -->
  <g transform="translate(350 160)">
    <rect x="0" y="0" width="500" height="280" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- header row -->
    <rect x="0" y="0" width="500" height="44" rx="12" fill="#334155" fill-opacity="0.4"/>
    <rect x="12" y="14" width="80" height="16" rx="4" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="140" y="14" width="60" height="16" rx="4" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="250" y="14" width="70" height="16" rx="4" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="370" y="14" width="90" height="16" rx="4" fill="#94a3b8" fill-opacity="0.3"/>
    <!-- data rows -->
    <rect x="12" y="60" width="100" height="12" rx="3" fill="#64748b" fill-opacity="0.25"/>
    <rect x="140" y="60" width="50" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="250" y="60" width="60" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="370" y="60" width="80" height="12" rx="3" fill="#22c55e" fill-opacity="0.3"/>

    <rect x="12" y="90" width="90" height="12" rx="3" fill="#64748b" fill-opacity="0.25"/>
    <rect x="140" y="90" width="55" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="250" y="90" width="65" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="370" y="90" width="70" height="12" rx="3" fill="#ef4444" fill-opacity="0.3"/>

    <rect x="12" y="120" width="110" height="12" rx="3" fill="#64748b" fill-opacity="0.25"/>
    <rect x="140" y="120" width="45" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="250" y="120" width="55" height="12" rx="3" fill="#64748b" fill-opacity="0.2"/>
    <rect x="370" y="120" width="85" height="12" rx="3" fill="#22c55e" fill-opacity="0.3"/>

    <!-- chart line inside ledger -->
    <polyline points="30,220 100,200 180,230 260,190 340,180 420,160 480,170"
              fill="none" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- spark -->
  <g transform="translate(920 170)" fill="#cbd5e1" fill-opacity="0.85">
    <path d="M20 0c2 15 6 19 21 21-15 2-19 6-21 21-2-15-6-19-21-21C14 19 18 15 20 0Z"/>
  </g>

  <!-- euro sign -->
  <g transform="translate(200 280)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="80" fill="#94a3b8" fill-opacity="0.15">€</text>
  </g>

  <!-- badge -->
  <rect x="830" y="360" width="200" height="36" rx="18" fill="#475569" fill-opacity="0.2" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="930" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#cbd5e1" letter-spacing="2">AI + APSKAITA</text>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#64748b"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · FINANSAI</text>
  </g>
</svg>
