<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI produkto nuotraukos e-commerce">
  <defs>
    <linearGradient id="bg-foto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1002"/>
      <stop offset="1" stop-color="#0f0a01"/>
    </linearGradient>
    <radialGradient id="glow-foto" cx="0.55" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-foto" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f59e0b" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-foto)"/>
  <rect width="1200" height="750" fill="url(#grid-foto)"/>
  <rect width="1200" height="750" fill="url(#glow-foto)"/>

  <!-- camera viewfinder frame -->
  <g transform="translate(400 140)">
    <rect x="0" y="0" width="400" height="300" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
    <!-- corner marks -->
    <path d="M0 40V16A16 16 0 0116 0H40" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M360 0H384A16 16 0 01400 16V40" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M400 260V284A16 16 0 01384 300H360" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M40 300H16A16 16 0 010 284V260" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="3"/>
    <!-- product box placeholder -->
    <rect x="140" y="80" width="120" height="140" rx="8" fill="#b45309" fill-opacity="0.25" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- crosshair -->
    <line x1="200" y1="130" x2="200" y2="170" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="180" y1="150" x2="220" y2="150" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- spark -->
  <g transform="translate(880 180)" fill="#fde68a" fill-opacity="0.85">
    <path d="M20 0c2 15 6 19 21 21-15 2-19 6-21 21-2-15-6-19-21-21C14 19 18 15 20 0Z"/>
  </g>

  <!-- small floating image cards -->
  <rect x="200" y="400" width="80" height="80" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="300" y="380" width="80" height="80" rx="10" fill="#b45309" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1"/>

  <!-- AI badge -->
  <rect x="830" y="300" width="180" height="36" rx="18" fill="#b45309" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
  <text x="920" y="324" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fde68a" letter-spacing="2">FOTO → AI</text>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#fde68a">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · FOTO</text>
  </g>
</svg>
