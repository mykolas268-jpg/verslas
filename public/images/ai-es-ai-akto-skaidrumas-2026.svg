<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ES AI akto skaidrumo prievolės">
  <defs>
    <linearGradient id="bg-eu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-eu" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#eab308" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-eu" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-eu)"/>
  <rect width="1200" height="750" fill="url(#grid-eu)"/>
  <rect width="1200" height="750" fill="url(#glow-eu)"/>

  <!-- EU stars circle -->
  <g transform="translate(600 300)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1d4ed8" stroke-opacity="0.2" stroke-width="1.5"/>
    <g fill="#eab308" fill-opacity="0.5">
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(0)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(30)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(60)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(90)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(120)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(150)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(180)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(210)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(240)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(270)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(300)"/>
      <polygon points="0,-110 3,-101 -3,-101" transform="rotate(330)"/>
    </g>

    <!-- shield / compliance icon in center -->
    <path d="M0-50 L35-30 L35 15 Q35 45 0 60 Q-35 45 -35 15 L-35-30 Z"
          fill="#1e293b" fill-opacity="0.6" stroke="#eab308" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- checkmark inside shield -->
    <polyline points="-14,8 -4,20 16,-6" fill="none" stroke="#eab308" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Article 50 reference -->
  <g transform="translate(200 180)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.25" stroke-width="1"/>
    <text x="90" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8" fill-opacity="0.5" letter-spacing="1">ARTICLE</text>
    <text x="90" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#eab308" fill-opacity="0.6" font-weight="600">50</text>
  </g>

  <!-- Timeline markers -->
  <g transform="translate(160 480)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#475569" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Feb 2025 -->
    <circle cx="0" cy="0" r="5" fill="#475569" fill-opacity="0.4"/>
    <text x="0" y="-14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8" fill-opacity="0.4">02/2025</text>
    <text x="0" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" fill-opacity="0.3">Draudimai</text>

    <!-- Aug 2026 - active -->
    <circle cx="440" cy="0" r="8" fill="#eab308" fill-opacity="0.3" stroke="#eab308" stroke-opacity="0.6" stroke-width="2"/>
    <text x="440" y="-14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#eab308" fill-opacity="0.7" font-weight="600">08/2026</text>
    <text x="440" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#eab308" fill-opacity="0.5">Skaidrumas</text>

    <!-- Dec 2027 -->
    <circle cx="730" cy="0" r="5" fill="#475569" fill-opacity="0.3"/>
    <text x="730" y="-14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8" fill-opacity="0.35">12/2027</text>
    <text x="730" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" fill-opacity="0.25">Aukšta rizika</text>

    <!-- Aug 2028 -->
    <circle cx="880" cy="0" r="5" fill="#475569" fill-opacity="0.25"/>
    <text x="880" y="-14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8" fill-opacity="0.3">08/2028</text>
    <text x="880" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" fill-opacity="0.2">Produktai</text>
  </g>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1">
    <rect x="150" y="600" width="14" height="14" rx="3" fill="#eab308" fill-opacity="0.5"/>
    <text x="178" y="612" font-size="26" letter-spacing="6" fill-opacity="0.9">ES AI AKTAS · SKAIDRUMAS</text>
  </g>
</svg>
