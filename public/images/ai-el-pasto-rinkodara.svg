<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI el. pašto rinkodara">
  <defs>
    <linearGradient id="bg-em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a14"/>
      <stop offset="1" stop-color="#1a0610"/>
    </linearGradient>
    <radialGradient id="glow-em" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-em" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fda4af" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-em)"/>
  <rect width="1200" height="750" fill="url(#dots-em)"/>
  <rect width="1200" height="750" fill="url(#glow-em)"/>

  <!-- envelope -->
  <g transform="translate(380 180)">
    <rect width="440" height="300" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#fda4af" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- envelope flap -->
    <path d="M0 0L220 140L440 0" fill="none" stroke="#fda4af" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- content lines inside -->
    <rect x="60" y="170" width="200" height="12" rx="6" fill="#fda4af" fill-opacity="0.2"/>
    <rect x="60" y="196" width="320" height="10" rx="5" fill="#fda4af" fill-opacity="0.12"/>
    <rect x="60" y="218" width="280" height="10" rx="5" fill="#fda4af" fill-opacity="0.08"/>
    <!-- CTA button -->
    <rect x="60" y="248" width="130" height="34" rx="17" fill="#e11d48" fill-opacity="0.4" stroke="#fda4af" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- open rate indicator -->
  <g transform="translate(900 220)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#fda4af" stroke-opacity="0.12" stroke-width="6"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="6"
            stroke-dasharray="220 94" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 60 60)"/>
    <text x="60" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#fecdd3" font-weight="bold">70%</text>
    <text x="60" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fecdd3" fill-opacity="0.6" letter-spacing="1">OPEN RATE</text>
  </g>

  <!-- notification badges -->
  <g>
    <circle cx="270" cy="260" r="14" fill="#e11d48" fill-opacity="0.6"/>
    <text x="270" y="265" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fff" font-weight="bold">3</text>
  </g>

  <!-- spark -->
  <g transform="translate(180 160)" fill="#fecdd3" fill-opacity="0.7">
    <path d="M16 0c2 12 5 15.5 17 17-12 1.5-15 5-17 17-2-12-5-15.5-17-17C11 15.5 14 12 16 0Z"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#fecdd3">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#f43f5e"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · EL. PAŠTAS</text>
  </g>
</svg>
