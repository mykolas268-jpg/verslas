<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meta Muse AI agentas verslui">
  <defs>
    <linearGradient id="bg-muse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-muse" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#0668E1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0668E1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-muse" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-muse)"/>
  <rect width="1200" height="750" fill="url(#grid-muse)"/>
  <rect width="1200" height="750" fill="url(#glow-muse)"/>

  <!-- agent central node -->
  <circle cx="600" cy="310" r="70" fill="#0668E1" fill-opacity="0.08" stroke="#0668E1" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="600" cy="310" r="40" fill="#0668E1" fill-opacity="0.15" stroke="#0668E1" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- infinity / agent icon -->
  <g transform="translate(600 310)" fill="none" stroke="#0668E1" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round">
    <path d="M-14,0 C-14,-10 -4,-14 0,-8 C4,-14 14,-10 14,0 C14,10 4,14 0,8 C-4,14 -14,10 -14,0 Z"/>
  </g>

  <!-- connection lines radiating out -->
  <!-- Instagram -->
  <line x1="555" y1="280" x2="420" y2="200" stroke="#E1306C" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="400" cy="185" r="26" fill="#1e293b" fill-opacity="0.6" stroke="#E1306C" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="388" y="178" width="24" height="14" rx="4" fill="#E1306C" fill-opacity="0.3"/>

  <!-- Facebook -->
  <line x1="545" y1="330" x2="380" y2="360" stroke="#1877F2" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="360" cy="365" r="26" fill="#1e293b" fill-opacity="0.6" stroke="#1877F2" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="348" y="358" width="24" height="14" rx="4" fill="#1877F2" fill-opacity="0.3"/>

  <!-- Shopify -->
  <line x1="645" y1="280" x2="780" y2="200" stroke="#96BF48" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="800" cy="185" r="26" fill="#1e293b" fill-opacity="0.6" stroke="#96BF48" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="788" y="178" width="24" height="14" rx="4" fill="#96BF48" fill-opacity="0.3"/>

  <!-- Stripe -->
  <line x1="655" y1="330" x2="820" y2="360" stroke="#635BFF" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="840" cy="365" r="26" fill="#1e293b" fill-opacity="0.6" stroke="#635BFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="828" y="358" width="24" height="14" rx="4" fill="#635BFF" fill-opacity="0.3"/>

  <!-- QuickBooks -->
  <line x1="580" y1="375" x2="500" y2="470" stroke="#2CA01C" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="485" cy="485" r="22" fill="#1e293b" fill-opacity="0.5" stroke="#2CA01C" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="475" y="479" width="20" height="12" rx="3" fill="#2CA01C" fill-opacity="0.2"/>

  <!-- Slack -->
  <line x1="620" y1="375" x2="700" y2="470" stroke="#4A154B" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="715" cy="485" r="22" fill="#1e293b" fill-opacity="0.5" stroke="#E01E5A" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="705" y="479" width="20" height="12" rx="3" fill="#E01E5A" fill-opacity="0.2"/>

  <!-- approval shield icon -->
  <g transform="translate(600 440)">
    <path d="M0,-22 L18,-12 L18,6 C18,16 10,22 0,28 C-10,22 -18,16 -18,6 L-18,-12 Z" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polyline points="-6,4 -2,10 8,-2" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- decorative analytics panel -->
  <g transform="translate(140 280)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="12" y="14" width="60" height="6" rx="2" fill="#0668E1" fill-opacity="0.3"/>
    <rect x="12" y="28" width="45" height="6" rx="2" fill="#0668E1" fill-opacity="0.2"/>
    <rect x="12" y="50" width="30" height="24" rx="3" fill="#22c55e" fill-opacity="0.15"/>
    <rect x="50" y="50" width="30" height="24" rx="3" fill="#ef4444" fill-opacity="0.15"/>
    <rect x="88" y="50" width="30" height="24" rx="3" fill="#fbbc05" fill-opacity="0.15"/>
  </g>

  <!-- title -->
  <text x="600" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" fill-opacity="0.9">Meta Muse</text>
  <text x="600" y="680" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" fill-opacity="0.7">AI agentas smulkiam verslui</text>
</svg>
