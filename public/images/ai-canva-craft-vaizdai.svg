<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Canva Craft vaizdų generavimas">
  <defs>
    <linearGradient id="bg-craft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-craft" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-craft" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-craft)"/>
  <rect width="1200" height="750" fill="url(#grid-craft)"/>
  <rect width="1200" height="750" fill="url(#glow-craft)"/>

  <!-- two-stage architecture visualization -->

  <!-- Stage 1: Planning -->
  <g transform="translate(300 220)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#7B2FF7" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- wireframe layout -->
    <rect x="15" y="15" width="190" height="30" rx="4" fill="#7B2FF7" fill-opacity="0.1" stroke="#7B2FF7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="15" y="55" width="120" height="60" rx="4" fill="#7B2FF7" fill-opacity="0.08" stroke="#7B2FF7" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="145" y="55" width="60" height="60" rx="4" fill="#7B2FF7" fill-opacity="0.08" stroke="#7B2FF7" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="15" y="125" width="190" height="20" rx="4" fill="#7B2FF7" fill-opacity="0.06" stroke="#7B2FF7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="15" y="155" width="90" height="30" rx="6" fill="#7B2FF7" fill-opacity="0.1" stroke="#7B2FF7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- label -->
    <text x="110" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7B2FF7" fill-opacity="0.6">1. Planavimas</text>
  </g>

  <!-- Arrow between stages -->
  <g transform="translate(540 310)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="100,-5 110,0 100,5" fill="#94a3b8" fill-opacity="0.3"/>
  </g>

  <!-- Stage 2: Generation -->
  <g transform="translate(670 220)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#00C4CC" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- filled design -->
    <rect x="15" y="15" width="190" height="30" rx="4" fill="#00C4CC" fill-opacity="0.15"/>
    <rect x="30" y="22" width="100" height="14" rx="3" fill="#e2e8f0" fill-opacity="0.15"/>

    <rect x="15" y="55" width="120" height="60" rx="4" fill="#7B2FF7" fill-opacity="0.12"/>
    <circle cx="75" cy="85" r="18" fill="#00C4CC" fill-opacity="0.1" stroke="#00C4CC" stroke-opacity="0.2" stroke-width="1"/>

    <rect x="145" y="55" width="60" height="60" rx="4" fill="#f59e0b" fill-opacity="0.1"/>
    <rect x="155" y="65" width="40" height="6" rx="2" fill="#e2e8f0" fill-opacity="0.12"/>
    <rect x="155" y="78" width="35" height="6" rx="2" fill="#e2e8f0" fill-opacity="0.08"/>
    <rect x="155" y="91" width="40" height="6" rx="2" fill="#e2e8f0" fill-opacity="0.1"/>

    <rect x="15" y="125" width="190" height="20" rx="4" fill="#94a3b8" fill-opacity="0.08"/>
    <rect x="25" y="130" width="140" height="8" rx="2" fill="#e2e8f0" fill-opacity="0.1"/>

    <rect x="15" y="155" width="90" height="30" rx="6" fill="#00C4CC" fill-opacity="0.2"/>
    <rect x="30" y="164" width="60" height="10" rx="3" fill="#e2e8f0" fill-opacity="0.15"/>

    <!-- label -->
    <text x="110" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#00C4CC" fill-opacity="0.6">2. Generavimas</text>
  </g>

  <!-- layers icon -->
  <g transform="translate(600 490)">
    <rect x="-35" y="0" width="70" height="40" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" transform="rotate(-3)"/>
    <rect x="-35" y="-8" width="70" height="40" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1" transform="rotate(1)"/>
    <rect x="-35" y="-16" width="70" height="40" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#7B2FF7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" fill-opacity="0.5">Magic Layers</text>
  </g>

  <!-- resolution badge -->
  <g transform="translate(170 300)">
    <rect x="0" y="0" width="70" height="30" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#00C4CC" stroke-opacity="0.3" stroke-width="1"/>
    <text x="35" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#00C4CC" fill-opacity="0.6">2K</text>
  </g>

  <!-- 30 formats badge -->
  <g transform="translate(960 300)">
    <rect x="0" y="0" width="90" height="30" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#7B2FF7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7B2FF7" fill-opacity="0.6">30 formatų</text>
  </g>

  <!-- title -->
  <text x="600" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" fill-opacity="0.9">Canva Craft</text>
  <text x="600" y="670" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" fill-opacity="0.7">Dizaino šablonais treniruotas AI modelis</text>
</svg>
