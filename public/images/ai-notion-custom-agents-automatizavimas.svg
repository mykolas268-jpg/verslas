<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notion Custom Agents automatizavimas">
  <defs>
    <linearGradient id="bg-notion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="glow-notion" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-notion" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-notion)"/>
  <rect width="1200" height="750" fill="url(#grid-notion)"/>
  <rect width="1200" height="750" fill="url(#glow-notion)"/>

  <!-- Central agent node -->
  <g transform="translate(600 290)">
    <circle cx="0" cy="0" r="50" fill="#1e293b" fill-opacity="0.6" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="2"/>
    <!-- robot/agent icon -->
    <rect x="-18" y="-20" width="36" height="28" rx="6" fill="none" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="-8" cy="-8" r="3" fill="#e2e8f0" fill-opacity="0.5"/>
    <circle cx="8" cy="-8" r="3" fill="#e2e8f0" fill-opacity="0.5"/>
    <rect x="-10" y="2" width="20" height="3" rx="1.5" fill="#e2e8f0" fill-opacity="0.3"/>
    <!-- antenna -->
    <line x1="0" y1="-20" x2="0" y2="-30" stroke="#e2e8f0" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="0" cy="-32" r="3" fill="#8b5cf6" fill-opacity="0.5"/>
    <!-- pulse rings -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Connection lines to data sources -->
  <!-- To Database -->
  <line x1="555" y1="260" x2="380" y2="180" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- To Slack -->
  <line x1="645" y1="260" x2="820" y2="180" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- To Schedule -->
  <line x1="560" y1="330" x2="340" y2="420" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- To Output -->
  <line x1="640" y1="330" x2="860" y2="420" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Database node -->
  <g transform="translate(300 140)">
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <!-- db icon -->
    <ellipse cx="40" cy="28" rx="14" ry="6" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="26" y1="28" x2="26" y2="44" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="54" y1="28" x2="54" y2="44" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <ellipse cx="40" cy="44" rx="14" ry="6" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="66" y="24" width="80" height="10" rx="2" fill="#94a3b8" fill-opacity="0.2"/>
    <rect x="66" y="42" width="60" height="8" rx="2" fill="#94a3b8" fill-opacity="0.12"/>
  </g>

  <!-- Slack node -->
  <g transform="translate(740 140)">
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <!-- # icon for channel -->
    <text x="36" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#8b5cf6" fill-opacity="0.4">#</text>
    <rect x="60" y="24" width="85" height="10" rx="2" fill="#94a3b8" fill-opacity="0.2"/>
    <rect x="60" y="42" width="65" height="8" rx="2" fill="#94a3b8" fill-opacity="0.12"/>
  </g>

  <!-- Schedule node -->
  <g transform="translate(240 400)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-opacity="0.25" stroke-width="1"/>
    <!-- clock icon -->
    <circle cx="40" cy="40" r="16" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="30" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="50" y2="44" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="68" y="26" width="110" height="10" rx="2" fill="#94a3b8" fill-opacity="0.2"/>
    <rect x="68" y="44" width="80" height="8" rx="2" fill="#94a3b8" fill-opacity="0.12"/>
  </g>

  <!-- Output page node -->
  <g transform="translate(760 400)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <!-- page icon -->
    <rect x="22" y="20" width="28" height="36" rx="3" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="28" y="28" width="16" height="3" rx="1" fill="#10b981" fill-opacity="0.3"/>
    <rect x="28" y="35" width="12" height="3" rx="1" fill="#10b981" fill-opacity="0.2"/>
    <rect x="28" y="42" width="14" height="3" rx="1" fill="#10b981" fill-opacity="0.2"/>
    <rect x="62" y="26" width="120" height="10" rx="2" fill="#10b981" fill-opacity="0.2"/>
    <rect x="62" y="44" width="90" height="8" rx="2" fill="#10b981" fill-opacity="0.12"/>
  </g>

  <!-- spark -->
  <g transform="translate(950 240)" fill="#8b5cf6" fill-opacity="0.4">
    <path d="M12 0c1.2 9 3.6 11.4 12.6 12.6-9 1.2-11.4 3.6-12.6 12.6-1.2-9-3.6-11.4-12.6-12.6C8.4 11.4 10.8 9 12 0Z"/>
  </g>

  <!-- badge -->
  <rect x="440" y="530" width="320" height="36" rx="18" fill="#475569" fill-opacity="0.2" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1"/>
  <text x="600" y="554" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#cbd5e1" fill-opacity="0.7" letter-spacing="2">AUTONOMOUS AGENTS</text>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1">
    <rect x="150" y="600" width="14" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.5"/>
    <text x="178" y="612" font-size="26" letter-spacing="6" fill-opacity="0.9">NOTION · CUSTOM AGENTS</text>
  </g>
</svg>
