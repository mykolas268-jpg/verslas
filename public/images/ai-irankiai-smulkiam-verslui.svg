<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="10 nemokamų AI įrankių smulkiam verslui">
  <defs>
    <linearGradient id="bg-tools" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#011a14"/>
    </linearGradient>
    <radialGradient id="glow-tools" cx="0.55" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-tools" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#34d399" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-tools)"/>
  <rect width="1200" height="750" fill="url(#dots-tools)"/>
  <rect width="1200" height="750" fill="url(#glow-tools)"/>

  <!-- tool grid: 3x2 rounded squares -->
  <g transform="translate(340 160)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="130" y="0" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="260" y="0" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="390" y="0" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5"/>

    <rect x="65" y="130" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="195" y="130" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="325" y="130" width="100" height="100" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- icons inside some squares -->
    <circle cx="50" cy="50" r="14" fill="none" stroke="#6ee7b7" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="180" cy="50" r="14" fill="#059669" fill-opacity="0.5"/>
    <rect x="296" y="36" width="28" height="28" rx="6" fill="none" stroke="#6ee7b7" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="440,36 454,64 426,64" fill="none" stroke="#6ee7b7" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- spark -->
  <g transform="translate(200 240)" fill="#6ee7b7" fill-opacity="0.8">
    <path d="M20 0c2 15 6 19 21 21-15 2-19 6-21 21-2-15-6-19-21-21C14 19 18 15 20 0Z"/>
  </g>

  <!-- count badge -->
  <rect x="830" y="300" width="160" height="36" rx="18" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.3" stroke-width="1"/>
  <text x="910" y="324" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a7f3d0" letter-spacing="2">10 · NEMOKAMI</text>

  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a7f3d0">
    <rect x="150" y="560" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="178" y="572" font-size="26" letter-spacing="6" fill-opacity="0.9">AI · ĮRANKIAI</text>
  </g>
</svg>
